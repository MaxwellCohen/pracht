name: pkg.pr.new

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "!**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Publish preview packages
    # Forks do not receive the OIDC id-token pkg.pr.new authenticates with.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # Install the GitHub App first: https://github.com/apps/pkg-pr-new
      # Auth is OIDC (id-token) — no npm token. Run once for all packages.
      - name: Publish to pkg.pr.new
        run: >-
          pnpm exec pkg-pr-new publish
          --pnpm
          --compact
          --no-template
          --previewVersion
          --packageManager=pnpm,npm
          --json output.json
          --comment=off
          './packages/*'

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { buildCommentBody, createOrUpdateComment } = require('./.github/scripts/pkg-pr-new-comment.cjs');
            const output = require('./output.json');
            const sha = context.payload.pull_request.head.sha;
            const body = buildCommentBody(output, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
            });
            await createOrUpdateComment({ github, context, body });
